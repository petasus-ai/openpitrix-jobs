name: Image

# Builds quay.io/edgestack/openpitrix-jobs. A push to master or a pull request only
# checks that the image builds. A tag vX.Y.Z (or vX.Y.Z-rc.N) on release-X.Y publishes
# :vX.Y.Z after the shared release tag guard, and latest when it is the newest final
# release. A published release is never built again: the image downloads the charts in
# urls.txt at build time, so a rebuild would not be the same image.
#
# One native runner per architecture, no QEMU; each pushes an untagged image by digest
# and the manifest job joins the two into the tagged list.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE_REPO: quay.io/edgestack/openpitrix-jobs

jobs:
  plan:
    name: Plan the image
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.plan.outputs.push }}
      tags: ${{ steps.plan.outputs.tags }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Guard the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: petasus-ai/.github/actions/guard-release-tag@30599a61231e382146695a0bbcaff37555bdb533
      - name: Decide what to publish
        id: plan
        run: |
          set -euo pipefail
          push=false
          tags=""
          version=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if docker buildx imagetools inspect "$IMAGE_REPO:$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "::notice::$IMAGE_REPO:$GITHUB_REF_NAME is already published; a release is never rebuilt."
            else
              push=true
              tags=$GITHUB_REF_NAME
              newest=$(git tag -l 'v*' | grep -Ex 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' | sort -V | tail -n 1 || true)
              if [ "$newest" = "$GITHUB_REF_NAME" ]; then
                tags="$tags latest"
              fi
            fi
          fi
          echo "push=$push tags='$tags' version=$version"
          {
            echo "push=$push"
            echo "tags=$tags"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [plan]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Derive a filename-safe platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - name: Stamp the build time
        run: echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to Quay
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: edgestack
          password: ${{ secrets.QUAY_CI_BOT_SECRET }}
      # The labels tell which commit and version an image was built from.
      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILDDATE=${{ env.CREATED }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ env.CREATED }}
          # Attestations would show up as unknown/unknown entries in the manifest list.
          provenance: false
          sbom: false
          outputs: ${{ needs.plan.outputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_REPO) || 'type=cacheonly' }}
      - name: Export digest
        if: needs.plan.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: needs.plan.outputs.push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Manifest list
    runs-on: ubuntu-latest
    needs: [plan, image]
    if: needs.plan.outputs.push == 'true'
    timeout-minutes: 15
    env:
      TAGS: ${{ needs.plan.outputs.tags }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: edgestack
          password: ${{ secrets.QUAY_CI_BOT_SECRET }}
      - name: Create the manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          tag_args=()
          for tag in ${TAGS}; do
            tag_args+=(-t "${IMAGE_REPO}:${tag}")
          done
          # shellcheck disable=SC2046 # one argument per digest file
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf "${IMAGE_REPO}@sha256:%s " *)
          for tag in ${TAGS}; do
            docker buildx imagetools inspect "${IMAGE_REPO}:${tag}"
          done
